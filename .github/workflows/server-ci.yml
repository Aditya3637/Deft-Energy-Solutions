name: Server CI

# Compile-verifies the NestJS + Prisma backend on GitHub's runners (no DB needed
# for validate/generate/build). Does not deploy — the server runs separately.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "server/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Dummy URL so Prisma can parse the schema; validate/generate/build don't connect.
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Type-check & build
        run: npm run build
      - name: Diagnosis engine invariants
        run: npx ts-node --transpile-only scripts/diagnosis-check.ts
      - name: Commission money invariants
        run: npx ts-node --transpile-only scripts/collections-check.ts
      - name: Auth JWT invariants
        run: npx ts-node --transpile-only scripts/auth-check.ts
      - name: Multi-DISCOM persona test (diagnosis)
        run: npx ts-node --transpile-only scripts/persona-discom-check.ts

  docker:
    runs-on: ubuntu-latest
    # Verifies the deploy image builds (prisma generate + tsc inside the image).
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t deft-energy-server ./server
