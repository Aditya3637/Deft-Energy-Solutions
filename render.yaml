# Render blueprint — provisions a managed Postgres + the backend web service
# from this repo. Connect the repo to Render (New → Blueprint) and it builds
# server/Dockerfile, injects DATABASE_URL, runs migrations + RLS + seed on boot,
# and serves /v1/health. (Free Postgres expires after 90 days; free web services
# sleep when idle — fine for a demo.)
databases:
  - name: deft-postgres
    plan: free
    databaseName: deft
    user: deft

services:
  - type: web
    name: deft-energy-server
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: deft-postgres
          property: connectionString
      - key: PORT
        value: "4000"
      - key: CORS_ORIGINS
        value: "https://aditya3637.github.io,https://deft-energy-solutions.vercel.app,http://localhost:3000"
      # Bill extraction (Stage G). Set the key in the Render dashboard — never commit it.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Vision model for extraction. Default claude-opus-4-8 (most accurate);
      # set claude-haiku-4-5 to trade some accuracy for ~5x lower cost at volume.
      - key: EXTRACT_MODEL
        value: "claude-opus-4-8"
